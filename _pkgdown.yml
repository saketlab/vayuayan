            "@type": "Question",
            "name": "How do I download CPCB air quality data in R?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Install the vayuayanR package and use cpcb_download_city_data() or cpcb_download_station_data() to download historical daily PM2.5 data for any CPCB CAAQMS station in India."
            }
          },
          {
            "@type": "Question",
            "name": "How can I get satellite PM2.5 data for any region?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Use vayuayanR's pm25_get_stats() function to extract WUSTL ACAG satellite PM2.5 estimates at 1 km resolution for any region using a GeoJSON boundary file. Coverage is global (1998-2022)."
            }
          },
          {
            "@type": "Question",
            "name": "How do I access real-time AQI data from CPCB?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Use cpcb_get_live_aqi_data() or cpcb_get_all_india() from the vayuayanR package to fetch live AQI readings from all CPCB CAAQMS monitoring stations across India."
            }
          },
          {
            "@type": "Question",
            "name": "What is the OAQ platform and how do I access it in R?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "OAQ (Open Air Quality) is a platform aggregating data from low-cost air quality sensors across India including Airnet. Use oaq_session() and oaq_get_daily() from vayuayanR to access historical and live data."
            }
          }
        ]
      }
      </script>

      <script>
      document.addEventListener('DOMContentLoaded', function() {

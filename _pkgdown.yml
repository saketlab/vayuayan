reference:
- title: "CPCB Historical Air Quality Data"
  desc: "Download historical daily PM2.5, PM10, and AQI data from CPCB CAAQMS monitoring stations across India"
  contents:
  - cpcb_get_complete_list
  - cpcb_get_state_list
  - cpcb_get_city_list
  - cpcb_get_station_list
  - cpcb_add_coords
  - cpcb_get_file_path
  - cpcb_download_city_data
  - cpcb_download_station_data

- title: "CPCB Real-Time AQI Data"
  desc: "Fetch live air quality index readings from CPCB CAAQMS monitoring stations across all Indian cities"
  contents:
  - cpcb_get_system_location
  - cpcb_get_all_india
  - cpcb_get_nearest_station
  - cpcb_get_live_aqi_data
  - cpcb_get_live_aqi_data_for_station

- title: "OAQ Low-Cost Sensor Network Data"
  desc: "Access air quality data from the Open Air Quality platform, including Airnet and other low-cost sensor providers across India"
  contents:
  - oaq_session
  - oaq_list_providers
  - oaq_get_hierarchy
  - oaq_get_stations_latest
  - oaq_get_city_latest
  - oaq_get_station_24h
  - oaq_get_daily
  - oaq_get_monthly
  - oaq_get_annual
  - oaq_fetch_monthly_stations

- title: "Satellite PM2.5 Data (WUSTL ACAG)"
  desc: "Download and analyze WUSTL ACAG satellite-derived PM2.5 estimates at 1 km resolution globally (1998-2022)"
  contents:
  - pm25_download_netcdf
  - pm25_get_stats
  - pm25_list_cached_files
  - pm25_clear_cache
  - pm25_v5gl04_path
  - pm25_read_netcdf_bbox
  - pm25_load_netcdf_bbox

- title: "Utility Functions"
  desc: "Helper functions for AQI categorization, station geolocation, spatial nearest-station matching, and data processing"
  contents:
  - stations_to_dataframe
  - analyze_station_data
  - clean_station_name
  - get_aqi_category
  - get_aqi_categories
  - haversine_distance
  - nearest_stations
  - vayuayan_welcome

- title: internal
  contents:
  - has_keyword("internal")

authors:
  Saket Choudhary:
    href: https://github.com/saketkc


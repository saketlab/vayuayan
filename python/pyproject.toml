[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vayuayan"
dynamic = ["version"]
description = "Get and analyze air quality data: CPCB India AQI and WUSTL ACAG satellite PM2.5"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = [
    "air quality",
    "AQI",
    "PM2.5",
    "pollution",
    "CPCB",
    "India",
    "satellite",
    "WUSTL ACAG",
    "GeoJSON",
]
authors = [
    {name = "Saket Choudhary", email = "saketc@iitb.ac.in"},
    {name = "Mahesh Kumar Prajapat", email = "22b0433@iitb.ac.in"}
]
maintainers = [
    {name = "Saket Choudhary", email = "saketc@iitb.ac.in"},
    {name = "Mahesh Kumar Prajapat", email = "22b0433@iitb.ac.in"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Typing :: Typed",
]
requires-python = ">=3.9"
dependencies = [
    "requests>=2.25.0",
    "pandas>=2.0",
    "openpyxl>=3.1.0",
    "urllib3>=1.26.0",
    "geopandas>=1.0.1",
    "rioxarray>=0.15.0",
    "xarray>=2024.7.0",
    "netCDF4>=1.7.2",
    "tqdm>=4.62.0",
    "earthengine-api>=0.1.384",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "pytest-cov",
    # tests/test_dump_raw_15min_pollutants.py imports scripts/dump_raw_15min_pollutants.py
    "duckdb",
    "pyarrow",
    "ruff",
    "mypy",
]
docs = [
    "myst-nb>=1.3.0",
    "sphinx>=8.2.3",
    "furo>=2024.8.6",
    "sphinx-multiversion>=0.2.4",
    "sphinxext-opengraph>=0.9.1",
    "sphinx-sitemap>=2.6.0",
]
notebooks = [
    "jupyter",
    "matplotlib",
    "seaborn",
]

[project.urls]
Homepage = "https://github.com/saketlab/vayuayan"
Repository = "https://github.com/saketlab/vayuayan.git"
Documentation = "https://vayuayan.saketlab.org/python/"
"Bug Tracker" = "https://github.com/saketlab/vayuayan/issues"
Changelog = "https://vayuayan.saketlab.org/python/history.html"

[project.scripts]
vayuayan = "vayuayan.cli:main"

[tool.setuptools]
packages = ["vayuayan", "vayuayan.data"]

[tool.setuptools.dynamic]
version = {attr = "vayuayan.__version__"}

[tool.setuptools.package-data]
vayuayan = ["py.typed"]
"vayuayan.data" = ["*.json"]

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
# ruff format sets the line length; it does not split long strings
ignore = ["E501"]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --strict-markers --strict-config"
testpaths = [
    "tests",
]
python_files = [
    "test_*.py",
    "*_test.py",
]

[tool.mypy]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "ee.*",
    "pandas.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "geopandas.*",
    "requests.*",
    "tqdm.*",
    "urllib3.*",
    "xarray.*",
    "rioxarray.*",
]
ignore_missing_imports = true

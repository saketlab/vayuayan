# OAQ live parity: the R and Python packages must return the same OAQ data.
# Only the OAQ cases of parity/ run here; GitHub runners cannot reach CPCB.
on:
  push:
    branches: [main]
    paths: ['python/vayuayan/oaq.py', 'R/R/oaq.R', 'parity/**', '.github/workflows/oaq-parity.yml']
  pull_request:
    branches: [main]
    paths: ['python/vayuayan/oaq.py', 'R/R/oaq.R', 'parity/**', '.github/workflows/oaq-parity.yml']
  schedule:
    # Mondays: catch OAQ API changes between code changes
    - cron: '17 4 * * 1'
  workflow_dispatch:

name: OAQ parity

permissions: read-all

jobs:
  oaq-parity:
    runs-on: ubuntu-latest
    env:
      OAQ_API_KEY: ${{ secrets.OAQ_API_KEY }}
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      VAYUAYAN_ONLINE: '1'
      PARITY_ONLY: oaq_
    steps:
      # Pull requests from forks get no secrets; there is nothing to test then
      - name: Check for the API key
        id: key
        run: echo "present=${{ env.OAQ_API_KEY != '' }}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.key.outputs.present == 'true'

      - uses: actions/setup-python@v5
        if: steps.key.outputs.present == 'true'
        with:
          python-version: "3.12"

      - name: Install the Python package
        if: steps.key.outputs.present == 'true'
        run: pip install -e "python[dev]"

      - uses: r-lib/actions/setup-r@v2
        if: steps.key.outputs.present == 'true'
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        if: steps.key.outputs.present == 'true'
        with:
          extra-packages: any::pkgload
          working-directory: R

      - name: Compare OAQ results of R and Python
        if: steps.key.outputs.present == 'true'
        run: python -m pytest parity -v

      - name: Skip without the API key
        if: steps.key.outputs.present != 'true'
        run: echo "::notice::OAQ_API_KEY is not available (fork pull request); OAQ parity skipped"

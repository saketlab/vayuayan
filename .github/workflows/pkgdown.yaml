# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  release:
    types: [published]
  workflow_dispatch:

name: pkgdown

permissions: read-all

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      NOT_CRAN: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::., any::kableExtra
          needs: website

      - name: Build site without rebuilding vignettes
        run: |
          Rscript -e '
            options(rmarkdown.html_vignette.check_title = FALSE)
            pkg <- pkgdown::as_pkgdown(".")
            pkgdown::clean_site(pkg, force = TRUE)
            pkgdown::build_home(pkg)
            pkgdown::build_reference(pkg)
            pkgdown::build_news(pkg)
            # Build articles from pre-built inst/doc HTMLs only
            pkgdown::build_articles_index(pkg)
            file.copy(
              list.files("inst/doc", pattern = "\\.html$", full.names = TRUE),
              "docs/articles/",
              overwrite = TRUE
            )
            pkgdown::build_redirects(pkg)
          '

      - name: Deploy to GitHub pages
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4.5.0
        with:
          clean: false
          branch: gh-pages
          folder: docs

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  release:
    types: [published]
  workflow_dispatch:

name: pkgdown

permissions: read-all

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      NOT_CRAN: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::., any::kableExtra
          needs: website

      # Vignettes use NAS paths unavailable on CI.
      # We ship pre-built vignette HTMLs in inst/doc and copy them into
      # the docs/articles folder so pkgdown serves them without re-knitting.
      - name: Copy pre-built vignette HTMLs to docs
        run: |
          mkdir -p docs/articles
          cp inst/doc/*.html docs/articles/ 2>/dev/null || true

      - name: Build site (skip vignette rebuild)
        run: |
          options(rmarkdown.html_vignette.check_title = FALSE)
          pkgdown::build_site_github_pages(
            new_process  = FALSE,
            install      = FALSE
          )
        shell: Rscript {0}

      - name: Deploy to GitHub pages 🚀
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4.5.0
        with:
          clean: false
          branch: gh-pages
          folder: docsv:

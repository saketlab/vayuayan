name: Publish to PyPI

# Push a version tag to release, for example:
#   git tag v0.1.5 && git push origin v0.1.5
# The tag must match __version__ in vayuayan/__init__.py.

on:
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: read

jobs:
  test:
    name: Test before release
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Make sure that the tag matches the package version
      run: |
        version=$(python -c "import re; print(re.search(r'__version__ = \"(.+?)\"', open('vayuayan/__init__.py').read()).group(1))")
        if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
          echo "Tag ${GITHUB_REF_NAME} does not match __version__ ${version}"
          exit 1
        fi
    - name: Install the package
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
    - name: Run the tests
      run: python -m pytest tests/ -q

  build:
    name: Build distribution 📦
    needs:
    - test
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.x"
    - name: Install pypa/build and twine
      run: python3 -m pip install --user build twine
    - name: Build a binary wheel and a source tarball
      run: python3 -m build
    - name: Check the distribution metadata
      run: python3 -m twine check --strict dist/*
    - name: Store the distribution packages
      uses: actions/upload-artifact@v4
      with:
        name: python-package-distributions
        path: dist/

  publish-to-pypi:
    name: >-
      Publish Python 🐍 distribution 📦 to PyPI
    needs:
    - build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/vayuayan
    permissions:
      id-token: write  # IMPORTANT: mandatory for trusted publishing

    steps:
    - name: Download all the dists
      uses: actions/download-artifact@v4
      with:
        name: python-package-distributions
        path: dist/
    - name: Publish distribution 📦 to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: >-
      Sign the Python 🐍 distribution 📦 with Sigstore
      and upload them to GitHub Release
    needs:
    - publish-to-pypi
    runs-on: ubuntu-latest

    permissions:
      contents: write  # IMPORTANT: mandatory for making GitHub Releases
      id-token: write  # IMPORTANT: mandatory for sigstore

    steps:
    - name: Download all the dists
      uses: actions/download-artifact@v4
      with:
        name: python-package-distributions
        path: dist/
    - name: Sign the dists with Sigstore
      uses: sigstore/gh-action-sigstore-python@v3.0.0
      with:
        inputs: >-
          ./dist/*.tar.gz
          ./dist/*.whl
    - name: Create GitHub Release
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: >-
        gh release create
        '${{ github.ref_name }}'
        --repo '${{ github.repository }}'
        --verify-tag
        --generate-notes
    - name: Upload artifact signatures to GitHub Release
      env:
        GITHUB_TOKEN: ${{ github.token }}
      # Upload to GitHub Release using the `gh` CLI.
      # `dist/` contains the built packages, and the
      # sigstore-produced signatures and certificates.
      run: >-
        gh release upload
        '${{ github.ref_name }}' dist/**
        --repo '${{ github.repository }}'

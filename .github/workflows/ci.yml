name: CI

on:
  push:
    branches: [ master, main ]
    paths: ['python/**', '.github/workflows/ci.yml']
  pull_request:
    branches: [ master, main ]
    paths: ['python/**', '.github/workflows/ci.yml']

env:
  # Windows runners default to a legacy code page; CPCB data has µ and ³
  PYTHONUTF8: "1"

defaults:
  run:
    working-directory: python

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: python/pyproject.toml

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Lint with ruff
      run: ruff check .

    - name: Type check with mypy
      run: mypy vayuayan/

  test:
    name: test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip
        cache-dependency-path: python/pyproject.toml

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Test with pytest
      run: python -m pytest tests/ -v --tb=short --cov=vayuayan --cov-report=term-missing --cov-report=xml

    - name: Test CLI functionality
      run: |
        python -m vayuayan --help
        vayuayan daily_aqi --help
        python -c "import vayuayan; print('Package imports successfully')"

  lowest-deps:
    # The oldest versions that pyproject.toml allows. pandas 2.0 wheels do not
    # work with numpy 2, so numpy is held below 2 here.
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.9"

    - name: Install the lowest direct dependencies
      run: |
        python -m pip install --upgrade pip uv
        uv pip install --system --resolution lowest-direct . "numpy>=1.24,<2"
        uv pip install --system pytest duckdb pyarrow

    - name: Test with pytest
      run: python -m pytest tests/ -q

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Build the sdist and the wheel
      run: |
        python -m pip install --upgrade pip build twine
        python -m build
        twine check --strict dist/*

    - name: Install the wheel in a clean environment
      run: |
        python -m venv /tmp/wheel-env
        /tmp/wheel-env/bin/pip install dist/*.whl
        cd /tmp
        /tmp/wheel-env/bin/vayuayan --help
        /tmp/wheel-env/bin/python -c "import vayuayan; from vayuayan.cpcb_directory import _station_directory; assert _station_directory()['states']; print(vayuayan.__version__)"

  docs:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install docs dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[docs]"

    - name: Build docs (fail on broken build)
      env:
        SPHINX_BUILD: "true"
      run: sphinx-build -b html docs docs/_build/html

  security:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install bandit
      run: |
        python -m pip install --upgrade pip
        pip install bandit[toml]

    - name: Run security scan
      run: |
        bandit -r vayuayan/ -f json -o bandit-report.json || true
        bandit -r vayuayan/ --severity-level medium

    - name: Upload security scan results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: bandit-report
        path: python/bandit-report.json

  # The notebooks call CPCB, which GitHub runners cannot reach, so CI does not
  # execute them. Run them locally:
  #   jupyter nbconvert --to notebook --execute docs/notebooks/*.ipynb
